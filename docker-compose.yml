name: llm_translate

services:
  postgres:
    image: postgres:16-alpine
    container_name: llm_translate_postgres
    environment:
      POSTGRES_USER: llm_user
      POSTGRES_PASSWORD: llm_pass
      POSTGRES_DB: llm_translate_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llm_user -d llm_translate_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
